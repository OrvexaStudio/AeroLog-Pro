<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AeroLog Pro</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">


<header class="top">

    <div>
        <h1>AEROLOG PRO</h1>
        <p>Virtual Flight Logbook</p>
    </div>

</header>



<main>


<section class="hero">

<p class="label">
TOTAL FLIGHT TIME
</p>

<h2 id="hours">
00h 00m
</h2>

<div class="flight-line"></div>


<div class="quick-data">

<div>
<span>FLIGHTS</span>
<strong>0</strong>
</div>


<div>
<span>AIRCRAFT</span>
<strong>0</strong>
</div>


<div>
<span>AIRPORTS</span>
<strong>0</strong>
</div>


</div>

</section>



<section class="rank-panel">

<p class="label">
PILOT STATUS
</p>

<h3>
Student Pilot
</h3>

<div class="progress">

<div></div>

</div>

</section>



<section class="recent">


<p class="label">
LAST FLIGHT
</p>


<div class="flight-card">

<div>

<strong>B737-800</strong>

<p>
LIBR → LIRF
</p>

</div>


<div class="time">
01:24
</div>


</div>


</section>


</main>




<nav class="bottom-nav">


<button onclick="changePage('home')" class="active">
<span>⌂</span>
Home
</button>


<button onclick="changePage('logbook')">
<span>▣</span>
Logbook
</button>



<button onclick="changePage('new')" class="add">
+
</button>







<button onclick="changePage('stats')">
<span>▤</span>
Stats
</button>


</nav>



</div>


<script src="script.js"></script>

</body>
</html>
